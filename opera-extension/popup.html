<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#16171d; --card:#21232c; --line:#2e3140; --text:#eef0f6; --muted:#9aa0b4; --accent:#ff3b5c; --ok:#1db954; }
  * { box-sizing: border-box; }
  body { margin:0; width:380px; background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  header img { width:22px; height:22px; }
  header b { font-size:15px; flex:1; }
  .pill { font-size:11px; padding:3px 8px; border-radius:20px; background:var(--card); color:var(--muted); }
  .pill.on { color:var(--ok); } .pill.off { color:#ffb020; }
  section { padding:12px 14px; }
  h2 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; }
  .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
  .row { display:flex; gap:8px; }
  button { flex:1; border:0; border-radius:9px; padding:8px 10px; font:600 12px "Segoe UI", sans-serif; cursor:pointer; color:#fff; background:var(--accent); }
  button.alt { background:#343848; }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.5; cursor:default; }
  .list { display:flex; flex-direction:column; gap:8px; max-height:260px; overflow:auto; }
  .item { background:var(--card); border-radius:12px; padding:9px 12px; }
  .meta { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
  .tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; background:#343848; }
  .tag.Audio { background:#204a3a; } .tag.Video { background:#4a2033; } .tag.stream { background:#20344a; }
  .url { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:7px; }
  .small button { padding:6px 8px; font-size:11px; }
  .empty { color:var(--muted); font-size:12px; }
  .toast { position:fixed; left:14px; right:14px; bottom:12px; padding:9px 12px; border-radius:10px; background:#2b2f3d; display:none; }
  .warn { margin:0 14px 4px; padding:9px 12px; border-radius:10px; background:#3a2f17; color:#ffd27a; font-size:12px; display:none; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <b>MediaGrab</b>
    <span id="status" class="pill">checking…</span>
  </header>
  <div id="warn" class="warn">The MediaGrab app isn't running. Open <b>MediaGrab.exe</b>, then try again.</div>

  <section>
    <h2>This page</h2>
    <div class="card">
      <div id="pageTitle" class="title">…</div>
      <div class="row">
        <button id="pageVideo">⬇ Best video</button>
        <button id="pageAudio" class="alt">♪ Best audio</button>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <h2 id="detHead">Detected media</h2>
    <div id="list" class="list"></div>
  </section>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>

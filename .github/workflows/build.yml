name: Build MediaGrab (Windows)

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly rebuild so the yt-dlp engine stays up to date with site changes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine + packager
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]" pyinstaller

      - name: Build MediaGrab.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name MediaGrab
          --icon assets/mediagrab.ico
          --collect-all yt_dlp_ejs
          app/mediagrab.py

      - name: Add ffmpeg (merges best video + best audio)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName dist/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") dist/

      - name: Add Deno (needed for YouTube's top-quality formats)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath dist

      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process dist/MediaGrab.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist/selftest.txt
          Remove-Item dist/selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Add Opera extension + guide
        shell: pwsh
        run: |
          Copy-Item opera-extension dist/opera-extension -Recurse
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-windows
          path: dist/
